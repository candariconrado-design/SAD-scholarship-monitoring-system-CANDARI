<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scholarship Programs</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html">Dashboard</a>
    <a href="scholars.html">Scholars</a>
    <a href="scholarships.html">Scholarship Programs</a>
    <a href="grades.html">Grade Submissions</a>
    <a href="compliance.html">Compliance</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="container">
    <h1>Scholarship Programs & Requirements</h1>

    <div class="card">
      <h2>Add / Edit Program</h2>
      <div id="message"></div>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Program Name *</label>
        <input type="text" id="program_name">
      </div>
      <div class="form-group">
        <label>Required GWA (lower is better) *</label>
        <input type="number" id="required_gwa" step="0.01" min="1" max="5">
      </div>
      <div class="form-group">
        <label>Minimum Units *</label>
        <input type="number" id="min_units" min="0">
      </div>
      <div class="form-group">
        <label>Allow Failing Grade?</label>
        <select id="allow_failing_grade">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
      <div class="form-group">
        <label>Active</label>
        <select id="active">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
      <button class="btn" onclick="saveProgram()">Save Program</button>
      <button class="btn" style="background:#718096" onclick="resetForm()">Clear</button>
    </div>

    <div class="card">
      <h2>Existing Programs</h2>
      <table>
        <thead>
          <tr>
            <th>Program Name</th>
            <th>Required GWA</th>
            <th>Min Units</th>
            <th>Allow Fail</th>
            <th>Active</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="programTable"></tbody>
      </table>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/scholarships.js"></script>
</body>
</html>
