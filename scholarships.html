<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scholarship Programs</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html">Dashboard</a>
    <a href="scholars.html">Scholars</a>
    <a href="scholarships.html">Scholarship Programs</a>
    <a href="grades.html">Grade Submissions</a>
    <a href="compliance.html">Compliance</a>
    <a href="#" onclick="logout(); return false;">Logout</a>
  </nav>

  <div class="container">
    <h1>Scholarship Programs & Requirements</h1>

    <div class="card">
      <h2 id="formTitle">Add New Program</h2>
      <div id="message"></div>
      <input type="hidden" id="editId">

      <div class="form-group">
        <label>Program Name *</label>
        <input type="text" id="program_name" placeholder="e.g. CHED Merit Scholarship">
      </div>
      <div class="form-group">
        <label>Required GWA (lower is better) *</label>
        <input type="number" id="required_gwa" step="0.01" min="1" max="5" placeholder="2.50">
      </div>
      <div class="form-group">
        <label>Minimum Units *</label>
        <input type="number" id="min_units" min="0" placeholder="18">
      </div>
      <div class="form-group">
        <label>Allow Failing Grade?</label>
        <select id="allow_failing_grade">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
      <div class="form-group">
        <label>Active</label>
        <select id="active">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <button class="btn" onclick="saveProgram()">Save Program</button>
      <button class="btn btn-secondary" onclick="resetForm()">Clear</button>
    </div>

    <div class="card">
      <h2>Existing Programs</h2>
      <table>
        <thead>
          <tr>
            <th>Program Name</th>
            <th>Required GWA</th>
            <th>Min Units</th>
            <th>Allow Fail</th>
            <th>Active</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="programTable">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const session = await requireAuth(['admin', 'staff']);
      if (!session) return;
      await loadPrograms();
    });

    async function loadPrograms() {
      const { data, error } = await sb
        .from('scholarship_programs')
        .select('id, program_name, required_gwa, min_units, allow_failing_grade, active')
        .order('program_name');

      const tbody = document.getElementById('programTable');
      if (error) {
        tbody.innerHTML = `<tr><td colspan="6">Error: ${error.message}</td></tr>`;
        return;
      }

      tbody.innerHTML = (data || []).map(p => `
        <tr>
          <td>${p.program_name}</td>
          <td>${p.required_gwa}</td>
          <td>${p.min_units}</td>
          <td>${p.allow_failing_grade ? 'Yes' : 'No'}</td>
          <td>${p.active ? 'Yes' : 'No'}</td>
          <td>
            <button class="btn" style="padding:6px 12px;font-size:13px" onclick='editProgram(${JSON.stringify(p)})'>Edit</button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="6" style="text-align:center;padding:30px;color:#64748b">No programs yet</td></tr>';
    }

    function editProgram(p) {
      document.getElementById('editId').value = p.id;
      document.getElementById('program_name').value = p.program_name;
      document.getElementById('required_gwa').value = p.required_gwa;
      document.getElementById('min_units').value = p.min_units;
      document.getElementById('allow_failing_grade').value = p.allow_failing_grade ? 'true' : 'false';
      document.getElementById('active').value = p.active ? 'true' : 'false';
      document.getElementById('formTitle').textContent = 'Edit Program';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('program_name').value = '';
      document.getElementById('required_gwa').value = '';
      document.getElementById('min_units').value = '';
      document.getElementById('allow_failing_grade').value = 'false';
      document.getElementById('active').value = 'true';
      document.getElementById('formTitle').textContent = 'Add New Program';
      document.getElementById('message').innerHTML = '';
    }

    async function saveProgram() {
      const msg = document.getElementById('message');
      const id = document.getElementById('editId').value;
      const program_name = document.getElementById('program_name').value.trim();
      const required_gwa = parseFloat(document.getElementById('required_gwa').value);
      const min_units = parseInt(document.getElementById('min_units').value);
      const allow_failing_grade = document.getElementById('allow_failing_grade').value === 'true';
      const active = document.getElementById('active').value === 'true';

      if (!program_name || Number.isNaN(required_gwa) || Number.isNaN(min_units)) {
        msg.innerHTML = '<div class="alert alert-error">All fields are required.</div>';
        return;
      }
      if (required_gwa < 1 || required_gwa > 5) {
        msg.innerHTML = '<div class="alert alert-error">Required GWA must be between 1.00 and 5.00.</div>';
        return;
      }
      if (min_units < 0) {
        msg.innerHTML = '<div class="alert alert-error">Minimum units cannot be negative.</div>';
        return;
      }

      const payload = { program_name, required_gwa, min_units, allow_failing_grade, active };

      let result;
      if (id) {
        result = await sb.from('scholarship_programs').update(payload).eq('id', id);
      } else {
        result = await sb.from('scholarship_programs').insert(payload);
      }

      if (result.error) {
        msg.innerHTML = `<div class="alert alert-error">${result.error.message}</div>`;
        return;
      }

      msg.innerHTML = '<div class="alert alert-success">Program saved successfully!</div>';
      resetForm();
      await loadPrograms();
    }
  </script>
</body>
</html>
