<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Scholarship Monitoring</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrapper"><div class="login-card">

      <h1>Scholarship Monitoring</h1>
      <p style="margin-bottom:20px;">Staff Login</p>
      <div id="message" style="margin-bottom:15px;"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn" id="loginBtn">Login</button>
  </div></div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('loginBtn').addEventListener('click', async function() {
        const msg = document.getElementById('message');
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        msg.textContent = 'Logging in…';

        if (!window.sb) {
          msg.innerHTML = '<div class="alert alert-error">Supabase client failed to load</div>';
          return;
        }

        try {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) {
            showMessage('message', error.message);
          } else {
            showMessage('message', 'Login successful. Redirecting…', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 800);
          }
        } catch (err) {
          showMessage('message', err.message);
        }
      });
    });
  </script>
</body>
</html>
