<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grade Submissions</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html">Dashboard</a>
    <a href="scholars.html">Scholars</a>
    <a href="scholarships.html">Scholarship Programs</a>
    <a href="grades.html">Grade Submissions</a>
    <a href="compliance.html">Compliance</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="container">
    <h1>Grade Submission & Verification</h1>

    <div class="card">
      <h2>Submit Semester Grades</h2>
      <div id="message"></div>
      <div class="form-group">
        <label>Scholar *</label>
        <select id="scholar_id"></select>
      </div>
      <div class="form-group">
        <label>Academic Year *</label>
        <input type="text" id="academic_year" placeholder="2025-2026">
      </div>
      <div class="form-group">
        <label>Semester *</label>
        <select id="semester">
          <option>1st Semester</option>
          <option>2nd Semester</option>
          <option>Summer</option>
        </select>
      </div>
      <div class="form-group">
        <label>GWA *</label>
        <input type="number" id="gwa" step="0.01" min="1" max="5">
      </div>
      <div class="form-group">
        <label>Units Enrolled *</label>
        <input type="number" id="units_enrolled" min="0">
      </div>
      <div class="form-group">
        <label>Failed Subjects</label>
        <input type="number" id="failed_subjects" min="0" value="0">
      </div>
      <div class="form-group">
        <label>Incomplete Subjects</label>
        <input type="number" id="incomplete_subjects" min="0" value="0">
      </div>
      <button class="btn" onclick="submitGrades()">Submit Grades</button>
    </div>

    <div class="card">
      <h2>Pending / For Verification</h2>
      <table>
        <thead>
          <tr>
            <th>Scholar</th>
            <th>Year</th>
            <th>Semester</th>
            <th>GWA</th>
            <th>Units</th>
            <th>Failed</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="pendingTable"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>All Submissions</h2>
      <table>
        <thead>
          <tr>
            <th>Scholar</th>
            <th>Year</th>
            <th>Semester</th>
            <th>GWA</th>
            <th>Status</th>
            <th>Verified At</th>
          </tr>
        </thead>
        <tbody id="allTable"></tbody>
      </table>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/grades.js"></script>
</body>
</html>
